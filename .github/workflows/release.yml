name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Fetch locked crates
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked --offline

      - name: Build unsigned native bundle
        run: python3 scripts/rune-native.py

      - name: Check native bundle
        run: python3 scripts/rune-native.py --check

      - name: Package bundle
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent build/rune-native/Antimatter.app artifacts/Antimatter-unsigned-macos.zip
          find artifacts -maxdepth 1 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: antimatter-macos-unsigned
          path: artifacts/**
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
