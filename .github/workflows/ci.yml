name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Fetch locked crates
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked --offline --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --offline

      - name: UI lint rules
        run: python3 scripts/ui-lint.py --self-test

      - name: Headless checks
        run: python3 scripts/rune-headless.py

      - name: UI scene lint
        run: python3 scripts/ui-lint.py

      - name: Upload headless and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-headless-evidence
          path: |
            build/rune-headless/**
            build/ui/**
          if-no-files-found: ignore
