[package]
name = "antimatter-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mattermost conversation, account and websocket services. No UI dependencies."

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url.workspace = true
uuid.workspace = true
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSWindow"] }
objc2-foundation = { version = "0.2.2", features = ["NSURL", "NSString", "NSError", "NSBundle", "NSArray", "NSDictionary"] }
objc2-authentication-services = { version = "0.2.2", features = ["ASWebAuthenticationSession", "ASFoundation", "block2"] }
block2 = "0.5.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
